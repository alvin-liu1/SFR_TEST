[PATH]
//DrawingPath为读图路径，ResultsPath为结果存储路径，缺省或输错则为默认路径，示例：C:/Users/Desktop
DrawingPath =D:\Code\SFR\SFR-test\photo\haisong
ResultsPath =D:\Code\SFR\SFR-test\photo\haisong

//画图功能

[DRAWING_F]       //执行画图功能
Enable=0         //整体画图使能开关，需要则设置成1
Suffix = 1        //输入图片后缀格式（1：bmp，2:jpg）
LineTV_En=1        //画标定TV line使能开关，需要则设置成1
LineTVRadius=2430    //设置画标定TV line半径(pixels)，P223:2500(176° 2601），V525:2400(160°-2581）
LineCrossTVAngle=11    //设置画标定十字TV line旋转角度
LineSFR_En=0     //画标定SFR使能开关，需要则设置成1
LineSFRRadius=2430    //2200 设置画标定SFR半径(pixels)
RS_EN=0           //开启读图循环，会删除指定Pictures路径下的图片，1s间隔刷新，多个图则会间隔1s单独显示，直至最后一张图
LineLength=300     //标定线绘制长度(pixels)，默认300

//SFR计算功能

[PROJECT]
 //输入项目名_后缀（后缀：_MZ模组、_ZJ整机，例子：P223_MZ ，V525_MZ，P223_ZJ，V525_ZJ，P528_MZ，P528_ZJ）
Name=P223_MZ       

//SFR参数设置
[P223_MZ]         //P223模组测试参数设置
AreaNum = 5       //输入测试区域数量，最大17
PixelSize = 0.8   //输入像素大小
TestFreq = 156    //输入测试频率
Gamma = 1         // 输入SFR gamma
Suffix = 2        //输入图片后缀格式（1：bmp，2:jpg）
AoiSave = 0       //是否需要更改AOI,需要则设置成1
Debug = 0         //是否需要输出过程数据,需要则设置成1
DeleteOriginPic = 0 //是否需要删除原始图像，1表示删除
SfrAngle = 8      //SFR斜边角度(度)，用于ROI定位偏移计算，默认8
SfrAngle = 8      //SFR斜边角度(度)，用于ROI定位偏移计算，默认8

